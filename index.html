<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CourtSide | Facilities & Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f1;--card:#fff;--tx:#151515;--mu:#6e6e6e;--ln:#e5e5e2;--or:#ff6a13;--in:#f7f7f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1c1c1c;--tx:#f2f2f2;--mu:#a0a0a0;--ln:#2e2e2e;--in:#242424;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--card:#1c1c1c;--tx:#f2f2f2;--mu:#a0a0a0;--ln:#2e2e2e;--in:#242424;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Semi Condensed','DM Sans',sans-serif;margin:0;letter-spacing:.01em}h1{font-size:30px}h2{font-size:19px}
#side{position:fixed;inset:0 auto 0 0;width:230px;background:#000;color:#ddd;padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;margin:0 0 18px 4px}.brand img{width:54px;height:54px;border-radius:50%;flex:none}.brand b{display:block;font:700 22px 'Barlow Semi Condensed',sans-serif;color:#fff;line-height:1}.brand .sub{color:var(--or);font:600 13px 'Barlow Semi Condensed',sans-serif;margin-top:4px}
#side a{color:#bbb;text-decoration:none;padding:9px 12px;border-radius:9px;border-left:3px solid transparent;transition:.15s}#side a:hover{background:#1c1c1c;color:#fff}
#side a.on{background:#1f1f1f;color:#fff;border-left-color:var(--or)}
main{margin-left:230px;padding:26px 30px 50px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.top p{margin:2px 0 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grid{display:grid;gap:16px}.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.mb{margin-bottom:16px}
.kpi b{display:block;font:700 34px 'Barlow Semi Condensed',sans-serif;line-height:1.1}.kpi span{color:var(--mu)}.kpi.hot b{color:var(--or)}
.btn{background:var(--or);color:#fff;border:0;border-radius:9px;padding:9px 15px;font:700 13px inherit;font-family:inherit;cursor:pointer}.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--in);color:var(--tx);border:1px solid var(--ln)}.btn.r{background:#c0392b}.btn.s{padding:5px 10px;font-size:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;width:100%}
:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.bar{height:8px;background:var(--in);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or);border-radius:9px;transition:width .5s}
.brow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:11px 0;cursor:pointer}.brow small{color:var(--mu);text-align:right}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border:0}.row small{color:var(--mu);display:block}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--in);color:var(--mu)}
.Completed{background:#1f7a4a22;color:#2e9d62}.Overdue,.High{background:#d6342922;color:#e0483c}.In-Progress{background:#2f7de122;color:#4d94f0}.Requires-Attention,.Medium{background:#ff6a1322;color:var(--or)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{text-align:left;color:var(--mu);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}tr.t{cursor:pointer}tr.t:hover{background:var(--in)}td small{color:var(--mu);display:block}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fl>*{flex:1 1 140px;width:auto}
.ring{position:relative;width:130px;height:130px;margin:auto}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 30px 'Barlow Semi Condensed',sans-serif}
.trend{display:flex;align-items:flex-end;gap:14px;height:150px}.trend div{flex:1;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.trend i{display:block;background:var(--or);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .d{min-height:84px;background:var(--in);border-radius:8px;padding:5px;font-size:12px;overflow:hidden}.cal .d.td{outline:2px solid var(--or)}.cal .h{color:var(--mu);text-align:center}
.cal .c{display:block;background:var(--card);border-left:3px solid var(--or);border-radius:4px;padding:1px 5px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:9}#ov.on{display:flex}
#md{background:var(--card);border-radius:16px;width:100%;max-width:640px;padding:22px;animation:pop .18s}@keyframes pop{from{transform:scale(.97);opacity:0}}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f2 label,.fw label{display:block;color:var(--mu);font-size:12px;margin-bottom:3px}.fw{grid-column:1/-1}
#toast{position:fixed;bottom:22px;right:22px;background:#111;color:#fff;border-left:4px solid var(--or);padding:12px 18px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;z-index:20;pointer-events:none}#toast.on{opacity:1;transform:none}
.empty{color:var(--mu);text-align:center;padding:26px}
@media(max-width:860px){#side{position:static;width:auto;flex-direction:row;flex-wrap:nowrap;align-items:center;padding:10px;overflow-x:auto}#side .brand{display:none}#side a{white-space:nowrap}main{margin:0;padding:18px 14px 40px}.brow{grid-template-columns:100px 1fr 70px}.f2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ban{display:flex;align-items:center;gap:18px;border-radius:14px;padding:14px 20px;margin-bottom:18px;flex-wrap:wrap;border:1px solid var(--ln)}.ban>div{flex:1;min-width:170px}.ban h1{font-size:28px}.ban p{margin:2px 0 0;opacity:.75}.ban img{object-fit:contain;border-radius:8px;max-width:100%}
#gate{position:fixed;inset:0;background:#000;color:#fff;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#gate img{width:90px;border-radius:50%}#gate h2{font-size:24px}#gate p{color:#9a9a9a;margin:0;min-height:20px}#dots{font-size:22px;letter-spacing:8px;color:var(--or);height:30px}
#keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}#keys button{height:72px;border-radius:50%;border:1px solid #333;background:#161616;color:#fff;font:600 24px 'DM Sans',sans-serif;cursor:pointer}#keys button:active{background:var(--or)}

const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),P=s=>new Date(s+'T00:00:00'),TD=iso(new Date());
const add=(s,n,m)=>{const d=P(s);m?d.setMonth(d.getMonth()+m):d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>s?P(s).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'Not yet';
const FQ={Daily:[1,0],Weekly:[7,0],Fortnightly:[14,0],Monthly:[0,1],Quarterly:[0,3],Annually:[0,12]};

function photo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,500/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.6);$('#md').dataset.photo=u;$('#f_img').src=u;$('#f_img').style.display='block'};im.src=r.result};r.readAsDataURL(f)}
function saveT(i){const v=k=>$('#f_'+k).value,name=v('name').trim();if(!name){toast('Enter a task name first.');$('#f_name').focus();return}
const o={name,dept:v('dept'),loc:v('loc'),desc:v('desc'),who:v('who').trim(),pri:v('pri'),freq:v('freq'),due:v('due')||TD,status:v('st'),notes:v('notes'),ext:$('#f_ext').checked,photo:$('#md').dataset.photo};
if(o.status=='Completed'&&i){done(i);return}
if(i)Object.assign(T.find(x=>x.id==i),o);else T.push({id:nid(),created:TD,last:'',...o});
save(i?T.find(x=>x.id==i):T[T.length-1]);closeM();render();toast(i?'Task updated.':'Task added.')}
function delT(i){if(!delArm){delArm=1;$('#dl').textContent='Click again to confirm';return}T=T.filter(x=>x.id!=i);if(DB)DB.collection('tasks').doc(String(i)).delete().catch(()=>toast('Could not delete. You may have view-only access.'));closeM();render();toast('Task deleted.')}
const closeM=()=>$('#ov').classList.remove('on');$('#ov').onclick=e=>{if(e.target.id=='ov')closeM()};addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
const NAV=[['dashboard','Dashboard'],...DEPTS.map((d,i)=>[SLUG[i],d]),['all','All maintenance tasks'],['reports','Reports & analytics']];
$('#side').insertAdjacentHTML('beforeend',NAV.map(n=>`<a href="#${n[0]}">${n[1].replace('&','&amp;')}</a>`).join(''));
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
function localShim(){const K='cs_tasks_local',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}},wr=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};let cb=null;const fire=()=>cb&&cb({docs:Object.values(rd()).map(d=>({data:()=>d}))});
return{collection:()=>({doc:i=>({set:async o=>{const a=rd();a[i]=o;wr(a);fire()},delete:async()=>{const a=rd();delete a[i];wr(a);fire()}}),onSnapshot:f=>{cb=f;fire()}})}}
(function(){let db;
if(FIREBASE_CONFIG.apiKey&&window.firebase){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){}}
if(!db){db=localShim();toast('Demo mode: tasks save on this device only. See SETUP.md to share them.')}
DB=db;db.collection('tasks').onSnapshot(s=>{T=s.docs.map(d=>({...d.data()}));location.hash.slice(1)=='all'?drawAll():render()},()=>toast('Could not load the shared task list.'))})();
(function(){const g=document.createElement('div');g.id='gate';
let ok='';try{ok=localStorage.getItem('cs_ok')}catch(e){}if(ok==ACCESS_CODE)return;
g.innerHTML='<img src="'+IMG.c+'" alt="CourtSide"><h2>Facilities &amp; Maintenance</h2><div id="dots"></div><p id="gm">Enter your code</p><div id="keys"></div>';document.body.appendChild(g);
let v='';const dots=()=>$('#dots').textContent='●'.repeat(v.length)+'○'.repeat(Math.max(0,ACCESS_CODE.length-v.length));dots();
const press=k=>{if(k=='⌫')v=v.slice(0,-1);else v+=k;dots();if(v.length>=ACCESS_CODE.length){if(v==ACCESS_CODE){try{localStorage.setItem('cs_ok',v)}catch(e){}g.remove()}else{$('#gm').textContent='Wrong code, try again';v='';setTimeout(dots,200)}}};
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{const b=document.createElement('button');b.textContent=k;if(!k)b.style.visibility='hidden';else b.onclick=()=>press(k);$('#keys').appendChild(b)})})();
</script></body></html>
